name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        id: gradle_build
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --scan-on-failure

      - name: Verify APK Generation & Diagnostics
        id: verify_apk
        if: always()
        run: |
          if [ -d "app/build/outputs/apk/debug" ] && ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
            APK_NAME=$(basename "$APK_PATH")
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
            echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
            echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "::notice title=APK Generated::$APK_NAME ($APK_SIZE)"
          else
            echo "apk_exists=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.gradle_build.outcome }}" != "success" ]; then
              echo "::error title=Build Failed::assembleDebug failed. Inspect logs for compilation or dependency errors."
            else
              echo "::error title=APK Not Found::assembleDebug finished but no APK was found in app/build/outputs/apk/debug/"
            fi
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.verify_apk.outputs.apk_exists == 'true'
        with:
          name: Rudra-Life-OS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🚀 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify_apk.outputs.apk_exists }}" == "true" ]; then
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Status** | ✅ SUCCESS |" >> $GITHUB_STEP_SUMMARY
            echo "| **APK Name** | \`${{ steps.verify_apk.outputs.apk_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **APK Size** | \`${{ steps.verify_apk.outputs.apk_size }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Artifact Name** | \`Rudra-Life-OS-Debug-APK\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Java Version** | 17 (Temurin) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Status** | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failing Task** | \`:app:assembleDebug\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Diagnostics** | Check Gradle stacktrace logs above for details |" >> $GITHUB_STEP_SUMMARY
          fi
